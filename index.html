<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콕콕 · 고르기 귀찮을 때</title>
<meta name="description" content="@kokkok.official이 직접 만든 도구 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--paper:#fff;--line:#efefef;--ink:#5e5143;--ink2:#6b645c;--muted:#9a9088;--box:#f5f4f3;--edge:#a39a91;--pink:#ffebec}
@media (prefers-color-scheme: dark){:root{--paper:#1c1916;--line:#26221e;--ink:#efe4d6;--ink2:#d8cdc0;--muted:#a3978a;--box:#26221e;--edge:#6d6359;--pink:#3a2a2b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper) repeating-linear-gradient(transparent 0 35px,var(--line) 35px 37px);color:var(--ink2);font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.65;
  padding:48px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:20px}
h1{margin:0;text-align:center;color:var(--ink);font-size:30px;letter-spacing:-.02em}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 0}
a.tool{display:block;background:var(--box);border:1.5px solid var(--edge);padding:18px 20px;color:var(--ink);text-decoration:none}
a.tool b{font-size:18px}
a.tool span{display:block;font-size:14px;color:var(--ink2)}
a.tool:hover,a.tool:focus-visible{background:var(--pink)}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.foot a{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>콕콕</h1><p class="sub">고르기 귀찮을 때, 콕 집어 둔 도구들</p></header>
  <a class="tool" href="salary/"><b>🧮 월급 쪼개기 계산기</b><span>세후 월급만 넣으면 통장 4개 금액 + 파킹통장 배치까지</span></a>
  <p class="foot"><a href="https://www.instagram.com/kokkok.official/">@kokkok.official</a></p>
</div>
</body>
</html>
